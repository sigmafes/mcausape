<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no and maximum-scale together are what stop a double-tap or a
     two-finger pinch from zooming the page: both are gestures the game wants for
     itself. viewport-fit=cover puts the canvas under the notch rather than
     letterboxed beside it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<title>mcausape</title>

<script>
// ---------------------------------------------------------------------------
// Input latency. The game's WebGL context is asked for low latency:
// desynchronized lets the browser show a frame without waiting on the page
// compositor (the queue that, when the GPU is the bottleneck, holds two or
// three finished frames - felt as the mouse and buttons lagging even at a
// steady 40 fps), and antialias off spares a multisampled copy of every frame
// (the shaders draw their own picture anyway). Only WebGL contexts are touched.
// ---------------------------------------------------------------------------
(function () {
  var get = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (type === 'webgl' || type === 'experimental-webgl' || type === 'webgl2') {
      attrs = attrs || {};
      if (attrs.desynchronized === undefined) attrs.desynchronized = true;
      attrs.antialias = false;
      if (!attrs.powerPreference) attrs.powerPreference = 'high-performance';
    }
    return get.call(this, type, attrs);
  };
})();
</script>
<script>
  // Which controls the game builds, decided before anything else on the page so
  // that the layout and the game agree. main_sdl.h reads this back out.
  //
  // (pointer: coarse) is about the *primary* pointer, so a laptop with a
  // touchscreen and a trackpad still says fine; pairing it with (hover: none)
  // keeps a stylus tablet from being mistaken for a phone. ?touch=1 / ?touch=0
  // forces it either way, which is how the touch build gets tested on a desktop.
  (function () {
    var forced = new URLSearchParams(location.search).get('touch');
    window.mcpeTouch = forced !== null
      ? (forced === '1' || forced === 'true')
      : (window.matchMedia('(pointer: coarse)').matches &&
         window.matchMedia('(hover: none)').matches);
    document.documentElement.className = window.mcpeTouch ? 'touch' : 'pointer';
  })();
</script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    color: #ddd;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: #1a1a1a;
  }
  /* No border or focus ring: the canvas is grabbed for pointer lock and an
     outline flashing on every click is distracting. */
  canvas {
    display: block;
    background: #000;
    outline: none;
    /* Keep the blocky textures blocky. */
    image-rendering: pixelated;
  }
  /* The page has nothing of its own on screen: every control is a menu item
     in the game now. What is left is the loading line before the game is up
     and the toast the game uses to report things that finish later. Neither
     takes clicks -- the whole tab is the game. */
  #status, #toast {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    box-sizing: border-box;
    padding: 6px 12px;
    font-size: 13px;
    text-align: center;
    pointer-events: none;
    border-radius: 4px;
  }
  #status { top: 50%; margin-top: -1em; }
  #status:empty { display: none; }
  #toast {
    bottom: max(48px, env(safe-area-inset-bottom));
    background: rgba(0, 0, 0, 0.7);
    color: #eee;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 15;
  }
  #toast.shown { opacity: 1; }
  #toast.error { color: #f99; }

  /* ---------------------------------------------------------------------
     Touch layout.

     A phone has one useful piece of screen and the game should have all of
     it, so the canvas is pinned to the viewport rather than laid out in the
     flow.
     --------------------------------------------------------------------- */
  html.touch, html.touch body {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    /* No rubber-banding, no pull-to-refresh, no text selection, no callout
       menu on a long press -- every one of those is a gesture the game means
       to use for digging. */
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* ---------------------------------------------------------------------
     The game's text-entry dialog.

     0.6.1 has no in-game text field -- TextBox is a stub whose whole body
     asks the platform to open the OS keyboard -- so naming a world has
     always been the platform's job. This is that dialog for the web. It
     replaced window.prompt, which could not hold two fields at once, could
     not be styled to sit in the same world as the game, and cost fullscreen
     every time it opened.
     --------------------------------------------------------------------- */
  #dialog {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.65);
    z-index: 20;
  }
  #dialog.hidden { display: none; }
  #dialogPanel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 340px;
    max-width: 100%;
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 18px 20px;
    background: #1a1a1a;
    border: 2px solid #4a4a4a;
    border-radius: 6px;
  }
  #dialogTitle { font-size: 15px; letter-spacing: 0.06em; }
  .dialogField { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #999; }
  .dialogField input {
    font: inherit;
    /* 16px exactly: iOS zooms the page when focusing anything smaller, and it
       ignores user-scalable=no for that. */
    font-size: 16px;
    color: #eee;
    background: #2a2a2a;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    padding: 8px 10px;
  }
  .dialogField input:focus { outline: none; border-color: #4e8a4e; }
  #dialogButtons { display: flex; gap: 8px; justify-content: flex-end; }
  #dialogButtons button {
    font: inherit;
    font-size: 13px;
    padding: 8px 16px;
    color: #ddd;
    background: #333;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    cursor: pointer;
  }
  #dialogButtons button:hover { background: #3d3d3d; }
  #dialogOk { background: #3b6b3b; border-color: #4e8a4e; color: #eaffea; }
  #dialogOk:hover:not(:disabled) { background: #457a45; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" width="854" height="480" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>

    <div id="status">Loading…</div>
    <div id="toast"></div>

    <!-- What the game's Import buttons open. Never shown; see mcpeSaves and
         mcpeSkin below. -->
    <input id="worldFile" type="file" accept=".zip,application/zip" multiple hidden>
    <input id="skinFile" type="file" accept="image/png" hidden>

    <!-- The phone's keyboard for the chat: an input nobody sees. The game draws
         the chat line itself, as on a PC (ChatScreen), and reads this. -->
    <input id="chatBridge" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           maxlength="100" aria-hidden="true"
           style="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;">
    <div id="dialog" class="hidden">
      <form id="dialogPanel" autocomplete="off">
        <div id="dialogTitle"></div>
        <div id="dialogFields"></div>
        <div id="dialogButtons">
          <button type="button" id="dialogCancel">Cancel</button>
          <button type="submit" id="dialogOk">OK</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('status');
    var canvas = document.getElementById('canvas');

    var Module = {
      canvas: canvas,
      // The game's own printf output; keep it in the console rather than on the
      // page, but surface hard failures in the status line.
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) { statusEl.textContent = text || ''; },
      onRuntimeInitialized: function () {
        statusEl.textContent = '';
        // Nothing may call into the wasm before this point; see mcpeReady.
        window.mcpeReady = true;
        fitCanvas();
      }
    };

    // Emscripten's SDL2 port requests pointer lock itself when the game calls
    // SDL_SetRelativeMouseMode. Browsers only grant that from a user gesture,
    // so make sure the canvas has focus for the keyboard to reach SDL too.
    canvas.addEventListener('click', function () { canvas.focus(); });

    window.onerror = function (message) { statusEl.textContent = 'Error: ' + message; };
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // Canvas sizing, fullscreen, and keeping the game's grab state in step with
  // the browser's pointer lock.
  // ---------------------------------------------------------------------------
  (function () {
    var wrap = document.getElementById('wrap');
    var canvas = document.getElementById('canvas');

    // Rendering is done at CSS pixel size rather than device pixels. It keeps
    // pointer coordinates a straight 1:1 with the canvas (no scaling factor to
    // get wrong), and this is a fill-rate-bound fixed-function renderer, so
    // quadrupling the pixels on a retina display costs far more than it adds to
    // art drawn at 16x16. The cap keeps a large monitor from doing the same.
    var MAX_W = 1920, MAX_H = 1080;

    // The window's inner size is wrong on a phone for most of the first second:
    // it counts the URL bar that is about to slide away. visualViewport is what
    // actually has the room the page can draw in.
    function viewport() {
      var vv = window.visualViewport;
      return {
        w: Math.floor(vv ? vv.width : window.innerWidth),
        h: Math.floor(vv ? vv.height : window.innerHeight)
      };
    }

    function fitCanvas() {
      // Exported wasm functions exist as stubs from the first line of script,
      // and calling one before the runtime is up aborts the whole module. A
      // phone fires a resize while the URL bar settles, which is early enough
      // to hit exactly that -- so this waits for onRuntimeInitialized rather
      // than for the symbol to be present.
      if (!window.mcpeReady || !window.Module || !Module._mcpe_resize) return;

      var view = viewport();

      // Every pixel goes to the game on both layouts: the controls are drawn
      // over the canvas rather than beside it.
      var w = Math.min(MAX_W, view.w);
      var h = Math.min(MAX_H, view.h);

      w = Math.max(320, w);
      h = Math.max(240, h);

      if (canvas.width === w && canvas.height === h) return;

      // SDL_SetWindowSize sets the backing store; the CSS size is set to match
      // so that one canvas pixel is one page pixel.
      Module._mcpe_resize(w, h);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    window.fitCanvas = fitCanvas;

    var pending = null;
    function scheduleFit() {
      clearTimeout(pending);
      pending = setTimeout(fitCanvas, 120);
    }

    window.addEventListener('resize', scheduleFit);
    window.addEventListener('orientationchange', scheduleFit);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleFit);
    }
    document.addEventListener('fullscreenchange', function () {
      // Fullscreen transitions animate; re-fit once the new size has settled.
      fitCanvas();
      scheduleFit();
    });

    // --- fullscreen ----------------------------------------------------------

    function isFullscreen() {
      return document.fullscreenElement != null || document.webkitFullscreenElement != null;
    }

    // Resolves whether or not it worked. An iPhone has no element fullscreen at
    // all -- only <video> gets it -- so this legitimately fails there, and the
    // touch layout is built so that failing costs nothing: the canvas already
    // fills the viewport, and Safari's own chrome slides away on its own.
    function requestFullscreen() {
      var el = document.documentElement;
      try {
        if (el.requestFullscreen) return el.requestFullscreen({ navigationUI: 'hide' });
        if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); return Promise.resolve(); }
      } catch (e) { /* fall through */ }
      return Promise.reject(new Error('no element fullscreen'));
    }

    function exitFullscreen() {
      try {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); return Promise.resolve(); }
      } catch (e) { /* fall through */ }
      return Promise.resolve();
    }

    // The game is a landscape game: the hotbar runs along the bottom and the
    // d-pad sits beside it, which in portrait leaves almost no world visible.
    // Only allowed while fullscreen, and only on Android -- iOS has no
    // orientation lock, which is why the overlay also asks in words.
    function lockLandscape() {
      try {
        if (screen.orientation && screen.orientation.lock)
          return screen.orientation.lock('landscape').catch(function () {});
      } catch (e) { /* not supported */ }
      return Promise.resolve();
    }

    function unlockOrientation() {
      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch (e) { /* not supported */ }
    }

    window.mcpeFullscreen = {
      // Whether there is any element fullscreen to ask for. An iPhone has none,
      // and the game leaves its Fullscreen toggle out when this says so.
      supported: function () {
        return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      },
      is: isFullscreen,
      enter: function () { return requestFullscreen().then(lockLandscape, lockLandscape); },
      exit: function () { unlockOrientation(); return exitFullscreen(); }
    };

    // --- pointer lock (desktop only) ----------------------------------------

    // MouseHandler::grab() sets window.mcpeWantPointerLock but cannot ask for
    // the lock itself -- the browser only grants it from inside a user gesture,
    // and the game grabs from its frame callback. This listener is that gesture.
    canvas.addEventListener('mousedown', function () {
      if (!window.mcpeWantPointerLock || document.pointerLockElement) return;
      var req = canvas.requestPointerLock();
      // Chrome briefly refuses re-locking right after the user pressed Escape;
      // that is the browser protecting them, so let it go quietly.
      if (req && req.catch) req.catch(function () {});
    });

    // Escape belongs to the browser while the pointer is locked: it exits the
    // lock and the keypress never reaches the page. Tell the game so it stops
    // believing it still holds the cursor.
    document.addEventListener('pointerlockchange', function () {
      if (!document.pointerLockElement && window.mcpeReady && window.Module && Module._mcpe_pointerlock_lost)
        Module._mcpe_pointerlock_lost();
    });
  })();
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // Touch: the page must not scroll, zoom or bounce.
  //
  // Those gestures belong to the game. There used to be a launch screen here
  // whose one big button doubled as the user gesture for fullscreen; the game's
  // own Options > Graphics > Fullscreen is that gesture now, and the game starts
  // straight away.
  // ---------------------------------------------------------------------------
  (function () {
    if (!window.mcpeTouch) return;

    // The text dialog is the exception: it can be taller than a phone held
    // sideways with the keyboard up, and a panel you cannot scroll to the
    // bottom of is a button you cannot press.
    var dialogPanel = document.getElementById('dialogPanel');
    document.addEventListener('touchmove', function (e) {
      if (dialogPanel && dialogPanel.contains(e.target)) return;
      e.preventDefault();
    }, { passive: false });

    // Safari's pinch zoom is its own event and ignores touch-action.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
      document.addEventListener(name, function (e) { e.preventDefault(); });
    });
  })();
  </script>

  <script>
  // Tab is the game's player list, held down. The browser would take it to
  // move focus out of the page, so it is kept -- except from a text field, where
  // it has to keep doing what it does.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    e.preventDefault();
  });
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // A line over the game for the results of things that finish after the click
  // that started them: a download, an import, a skin that would not load.
  // ---------------------------------------------------------------------------
  (function () {
    var el = document.getElementById('toast');
    var timer = null;
    window.mcpeToast = function (text, isError) {
      el.textContent = text;
      el.classList.toggle('error', !!isError);
      el.classList.add('shown');
      clearTimeout(timer);
      timer = setTimeout(function () { el.classList.remove('shown'); }, 4000);
    };
  })();
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // World export / import, and the profile skin.
  //
  // Worlds live in IndexedDB, which the browser is free to evict and which any
  // "clear browsing data" wipes. The world list's Export and Import buttons
  // move one world out, or any number in, as an ordinary .zip, so a world can
  // be kept, backed up or moved to another machine. Written by hand rather than
  // pulled from a library so the page stays one file with no external requests.
  //
  // The skin is a PNG kept beside the worlds, so it survives a reload the same
  // way they do, and decoded here because the browser already has a PNG
  // decoder and the game does not need a second one.
  //
  // The game calls all of this through WebBridge.cpp, from a button handler,
  // which is late enough to be a frame after the click and early enough to
  // still count as one: a file picker opens only from a user gesture.
  // ---------------------------------------------------------------------------
  (function () {
    var SAVES = '/saves';
    var WORLDS = SAVES + '/games/com.mojang/minecraftWorlds';
    var SKIN = SAVES + '/mcpe_skin.png';

    function toast(text, isError) {
      if (window.mcpeToast) window.mcpeToast(text, isError);
    }

    function flush() {
      return new Promise(function (resolve, reject) {
        Module.FS.syncfs(false, function (err) { err ? reject(err) : resolve(); });
      });
    }

    // --- zip primitives ------------------------------------------------------

    var crcTable = (function () {
      var t = new Uint32Array(256);
      for (var i = 0; i < 256; i++) {
        var c = i;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })();

    function crc32(bytes) {
      var c = 0xFFFFFFFF;
      for (var i = 0; i < bytes.length; i++)
        c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    // deflate-raw is exactly zip's method 8. Where it isn't available the entry
    // is stored uncompressed instead, which every unzipper still understands.
    async function deflateRaw(bytes) {
      if (typeof CompressionStream === 'undefined') return null;
      try {
        var cs = new CompressionStream('deflate-raw');
        var stream = new Blob([bytes]).stream().pipeThrough(cs);
        return new Uint8Array(await new Response(stream).arrayBuffer());
      } catch (e) { return null; }
    }

    async function inflateRaw(bytes) {
      var ds = new DecompressionStream('deflate-raw');
      var stream = new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    function dosDateTime(d) {
      return {
        time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
        date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
      };
    }

    // [{path, data}] -> a zip Blob.
    async function buildZip(files) {
      var stamp = dosDateTime(new Date());
      var chunks = [], central = [], offset = 0;

      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var nameBytes = new TextEncoder().encode(f.path);
        var raw = f.data;
        var crc = crc32(raw);

        var packed = await deflateRaw(raw);
        var method = 8;
        if (!packed || packed.length >= raw.length) { packed = raw; method = 0; }

        var local = new Uint8Array(30 + nameBytes.length);
        var lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(8, method, true);
        lv.setUint16(10, stamp.time, true);
        lv.setUint16(12, stamp.date, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, packed.length, true);
        lv.setUint32(22, raw.length, true);
        lv.setUint16(26, nameBytes.length, true);
        local.set(nameBytes, 30);

        var cd = new Uint8Array(46 + nameBytes.length);
        var cv = new DataView(cd.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(10, method, true);
        cv.setUint16(12, stamp.time, true);
        cv.setUint16(14, stamp.date, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, packed.length, true);
        cv.setUint32(24, raw.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint32(42, offset, true);
        cd.set(nameBytes, 46);

        chunks.push(local, packed);
        central.push(cd);
        offset += local.length + packed.length;
      }

      var centralSize = central.reduce(function (n, c) { return n + c.length; }, 0);
      var eocd = new Uint8Array(22);
      var ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, central.length, true);
      ev.setUint16(10, central.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, offset, true);

      return new Blob(chunks.concat(central, [eocd]), { type: 'application/zip' });
    }

    // A zip's file entries as [{path, data}], directories and anything that
    // would climb out of where it is unpacked left out.
    async function readZip(file) {
      var buf = new Uint8Array(await file.arrayBuffer());
      var dv = new DataView(buf.buffer);

      // Find the end-of-central-directory record by scanning backwards.
      var eocd = -1;
      for (var i = buf.length - 22; i >= 0 && i > buf.length - 65558; i--) {
        if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error('not a zip file');

      var count = dv.getUint16(eocd + 10, true);
      var pos = dv.getUint32(eocd + 16, true);
      var out = [];

      for (var n = 0; n < count; n++) {
        if (dv.getUint32(pos, true) !== 0x02014b50) throw new Error('bad central directory');

        var method     = dv.getUint16(pos + 10, true);
        var compSize   = dv.getUint32(pos + 20, true);
        var nameLen    = dv.getUint16(pos + 28, true);
        var extraLen   = dv.getUint16(pos + 30, true);
        var commentLen = dv.getUint16(pos + 32, true);
        var localAt    = dv.getUint32(pos + 42, true);
        var name = new TextDecoder().decode(buf.subarray(pos + 46, pos + 46 + nameLen));
        pos += 46 + nameLen + extraLen + commentLen;

        name = name.replace(/\\/g, '/');
        if (name.endsWith('/')) continue;
        if (name.startsWith('/') || name.split('/').indexOf('..') !== -1) continue;
        // What macOS's Finder adds to every zip it makes.
        if (name.startsWith('__MACOSX/') || name.split('/').pop() === '.DS_Store') continue;

        // The local header's name/extra lengths are authoritative for finding
        // where the data actually starts, and may differ from the central copy.
        var localNameLen  = dv.getUint16(localAt + 26, true);
        var localExtraLen = dv.getUint16(localAt + 28, true);
        var start = localAt + 30 + localNameLen + localExtraLen;
        var data = buf.subarray(start, start + compSize);

        if (method === 8) data = await inflateRaw(data);
        else if (method !== 0) throw new Error('unsupported compression in ' + name);
        out.push({ path: name, data: data });
      }
      return out;
    }

    // --- walking the emscripten filesystem -----------------------------------

    function listFiles(dir, prefix, out) {
      var entries;
      try { entries = Module.FS.readdir(dir); }
      catch (e) { return out; }

      entries.forEach(function (name) {
        if (name === '.' || name === '..') return;
        var full = dir + '/' + name;
        var rel = prefix ? prefix + '/' + name : name;
        var stat = Module.FS.stat(full);
        if (Module.FS.isDir(stat.mode)) listFiles(full, rel, out);
        else out.push({ path: rel, data: Module.FS.readFile(full) });
      });
      return out;
    }

    function mkdirTree(path) {
      var parts = path.split('/').filter(Boolean);
      var built = '';
      parts.forEach(function (p) {
        built += '/' + p;
        try { Module.FS.mkdir(built); } catch (e) { /* already there */ }
      });
    }

    function exists(path) {
      try { Module.FS.stat(path); return true; } catch (e) { return false; }
    }

    function download(blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    }

    // --- worlds --------------------------------------------------------------

    // One world, as <id>/level.dat, <id>/chunks.dat and so on: unzipped, it is
    // a folder named after the world, and the import below reads it back.
    async function exportWorld(id) {
      var files = listFiles(WORLDS + '/' + id, id, []);
      if (!files.length) { toast('Nothing to export in ' + id, true); return; }
      toast('Packing ' + id + '…');
      var blob = await buildZip(files);
      download(blob, id + '.zip');
      toast('Exported ' + id + ' (' + (blob.size / 1048576).toFixed(1) + ' MB)');
    }

    // A world is wherever a level.dat is, so this takes the zips the export
    // above makes, a zip of a bare world folder, and the whole-saves backups the
    // page's old "Download worlds" button made (games/com.mojang/...) alike.
    // A world whose folder name is taken comes in beside it, not over it.
    async function importZip(file, taken) {
      var entries = await readZip(file);
      var roots = [];
      entries.forEach(function (e) {
        var parts = e.path.split('/');
        if (parts.pop() === 'level.dat') roots.push(parts.join('/'));
      });
      if (!roots.length) throw new Error('no world in ' + file.name);

      var imported = 0;
      roots.forEach(function (root) {
        var base = root ? root.split('/').pop() : file.name.replace(/\.zip$/i, '');
        // What the game itself refuses in a folder name.
        var id = base.replace(/[\/\n\r\t\0\f`?*\\<>|":]/g, '') || 'imported';
        while (taken[id]) id += '-';
        taken[id] = true;

        var prefix = root ? root + '/' : '';
        entries.forEach(function (e) {
          if (prefix && e.path.indexOf(prefix) !== 0) return;
          var rel = e.path.slice(prefix.length);
          var full = WORLDS + '/' + id + '/' + rel;
          mkdirTree(full.slice(0, full.lastIndexOf('/')));
          Module.FS.writeFile(full, e.data);
        });
        imported++;
      });
      return imported;
    }

    async function importWorlds(files) {
      var taken = {};
      try { Module.FS.readdir(WORLDS).forEach(function (n) { taken[n] = true; }); }
      catch (e) { /* no worlds yet */ }

      var total = 0, failed = [];
      for (var i = 0; i < files.length; i++) {
        try { total += await importZip(files[i], taken); }
        catch (e) { failed.push(files[i].name); console.error('mcpe: import', files[i].name, e); }
      }
      if (total) {
        await flush();
        changed = true;
      }
      if (failed.length)
        toast((total ? 'Imported ' + total + '; could not read ' : 'Could not read ') + failed.join(', '), true);
      else
        toast('Imported ' + total + (total === 1 ? ' world' : ' worlds'));
    }

    var changed = false;
    var worldFile = document.getElementById('worldFile');
    worldFile.addEventListener('change', function () {
      var files = Array.prototype.slice.call(worldFile.files);
      worldFile.value = '';
      if (!files.length) return;
      toast('Importing…');
      importWorlds(files).catch(function (e) { toast('Import failed: ' + e.message, true); });
    });

    // One flush at a time; a request that comes in while one runs is run once
    // more afterwards, so nothing written after it started is left behind.
    var flushing = false, flushAgain = false;
    function flushSoon() {
      if (flushing) { flushAgain = true; return; }
      flushing = true;
      flush().catch(function () {}).then(function () {
        flushing = false;
        if (flushAgain) { flushAgain = false; flushSoon(); }
      });
    }

    window.mcpeSaves = {
      flush: flushSoon,
      exportWorld: function (id) {
        exportWorld(id).catch(function (e) { toast('Export failed: ' + e.message, true); });
      },
      importWorlds: function () { worldFile.click(); },
      // Read by the world list each tick; true once per finished import.
      takeChanged: function () { var c = changed; changed = false; return c; }
    };

    // --- skin ----------------------------------------------------------------

    // PNG bytes -> {w, h, rgba}. premultiplyAlpha 'none' matters: the outer
    // layer is mostly see-through pixels, and premultiplying would round the
    // colour out of every one of them.
    async function decodeSkin(blob) {
      var bmp = await createImageBitmap(blob, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
      var w = bmp.width, h = bmp.height;
      if (w !== 64 || (h !== 64 && h !== 32)) {
        bmp.close && bmp.close();
        throw new Error('a skin is 64x64 or 64x32 pixels; this is ' + w + 'x' + h);
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(bmp, 0, 0);
      bmp.close && bmp.close();
      return { w: w, h: h, rgba: ctx.getImageData(0, 0, w, h).data };
    }

    // Copies the pixels into the module's heap for the length of one call;
    // Minecraft::setLocalSkin keeps its own copy.
    function giveToGame(img) {
      if (!window.mcpeReady || !Module._mcpe_skin_set) return;
      var ptr = Module._malloc(img.rgba.length);
      (Module.HEAPU8 || HEAPU8).set(img.rgba, ptr);
      Module._mcpe_skin_set(ptr, img.w, img.h);
      Module._free(ptr);
    }

    var skinFile = document.getElementById('skinFile');
    skinFile.addEventListener('change', function () {
      var file = skinFile.files[0];
      skinFile.value = '';
      if (!file) return;
      (async function () {
        var img = await decodeSkin(file);
        Module.FS.writeFile(SKIN, new Uint8Array(await file.arrayBuffer()));
        giveToGame(img);
        await flush();
        toast('Skin changed');
      })().catch(function (e) { toast('Not a skin: ' + e.message, true); });
    });

    window.mcpeSkin = {
      pick: function () { skinFile.click(); },
      reset: function () {
        if (exists(SKIN)) {
          try { Module.FS.unlink(SKIN); } catch (e) { /* gone already */ }
          flush().catch(function () {});
        }
        toast('Skin reset');
      },
      loadSaved: function () {
        if (!exists(SKIN)) return;
        var bytes = Module.FS.readFile(SKIN);
        decodeSkin(new Blob([bytes], { type: 'image/png' }))
          .then(giveToGame)
          .catch(function (e) { console.error('mcpe: saved skin unreadable', e); });
      }
    };
  })();
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // The game's text-entry dialog.
  //
  // The game asks the platform to collect text -- a world name and seed, a chat
  // line -- and then polls every tick until an answer turns up. See
  // AppPlatform_sdl_dialog_web.cpp for the other half, and for why answering
  // asynchronously needed nothing to change on the game's side.
  // ---------------------------------------------------------------------------
  (function () {
    // Mirrors AppPlatform_sdl::USERINPUT_*.
    var PENDING = -2, CANCEL = 0, OK = 1;

    var root      = document.getElementById('dialog');
    var form      = document.getElementById('dialogPanel');
    var titleEl   = document.getElementById('dialogTitle');
    var fieldsEl  = document.getElementById('dialogFields');
    var okBtn     = document.getElementById('dialogOk');
    var cancelBtn = document.getElementById('dialogCancel');
    var canvas    = document.getElementById('canvas');

    var state = CANCEL;
    var values = [];
    var inputs = [];

    function isOpen() { return !root.classList.contains('hidden'); }

    function close(result) {
      if (!isOpen()) return;
      // Read the fields before hiding: blurring an input can change nothing,
      // but the answer belongs to the moment the player accepted it.
      values = inputs.map(function (input) { return input.value; });
      state = result;
      root.classList.add('hidden');
      // Hand the keyboard back to the game.
      if (document.activeElement && document.activeElement.blur)
        document.activeElement.blur();
      if (canvas) canvas.focus();
    }

    form.addEventListener('submit', function (e) { e.preventDefault(); close(OK); });
    cancelBtn.addEventListener('click', function () { close(CANCEL); });

    // While the panel is up the keyboard belongs to it. SDL installs its own
    // document listeners when the module loads, which is after this script runs,
    // so a capture-phase listener here gets there first and can stop the game
    // reading what is being typed into the box. stopImmediatePropagation rather
    // than preventDefault: the character still has to reach the input, and Enter
    // still has to submit the form -- both are default actions, not listeners.
    ['keydown', 'keyup', 'keypress'].forEach(function (name) {
      document.addEventListener(name, function (e) {
        if (!isOpen()) return;
        if (name === 'keydown' && e.key === 'Escape') close(CANCEL);
        e.stopImmediatePropagation();
      }, true);
    });

    // F5 is the game's camera key; to the browser it means reload, which threw
    // away the world. The text dialog keeps its own keys (see above).
    document.addEventListener('keydown', function (e) {
      if (e.key === 'F5' && !isOpen()) e.preventDefault();
    }, true);

    window.mcpeDialog = {
      open: function (spec) {
        fieldsEl.innerHTML = '';
        inputs = [];
        values = [];
        titleEl.textContent = spec.title;
        okBtn.textContent = spec.okLabel || 'OK';

        spec.fields.forEach(function (f) {
          var label = document.createElement('label');
          label.className = 'dialogField';

          var caption = document.createElement('span');
          caption.textContent = f.label;

          var input = document.createElement('input');
          input.type = 'text';
          input.value = f.value || '';
          input.spellcheck = false;
          input.autocapitalize = 'off';

          label.appendChild(caption);
          label.appendChild(input);
          fieldsEl.appendChild(label);
          inputs.push(input);
        });

        state = PENDING;
        root.classList.remove('hidden');
        if (inputs[0]) { inputs[0].focus(); inputs[0].select(); }
      },

      status: function () { return state; },
      value: function (i) { return values[i] != null ? values[i] : ''; }
    };
  })();
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // Music.
  //
  // Driven by Minecraft::updateMusic: on whenever no world is loaded, off on the
  // way into one, at whatever the Options music slider says. That slider has
  // existed since 2013 with nothing behind it; this is what finally moves.
  //
  // It lives here rather than in SoundEngine because a track is two orders of
  // magnitude longer than anything in data/sound, and that path decodes a whole
  // file into memory to play it. An <audio> element streams instead, and the
  // file is served next to index.html rather than preloaded into the .data
  // package, so it costs nothing before the menu is up.
  //
  // No track shipped? Everything below quietly does nothing and the game is
  // silent, which is how 0.6.1 always was.
  // ---------------------------------------------------------------------------
  (function () {
    // mp3 rather than the aac the sound effects use: the track arrives as mp3,
    // every browser plays it, and re-encoding one lossy format into another
    // costs quality to save nothing.
    // Index = the track number Minecraft::updateMusic asks for (0 = none).
    // Every place has a playlist. The menu's: one of four, the next a few
    // seconds after. The Nether's: a random song (never the
    // same one twice running), then two minutes of silence, then another,
    // for as long as the player stays in the Nether.
    var N = 'music/';
    var TRACKS = [null,
      { list: [N + 'menu1.mp3', N + 'menu2.mp3', N + 'menu3.mp3', N + 'menu4.mp3'], gap: 5000 },
      { list: [N + 'nether1.mp3', N + 'nether2.mp3', N + 'nether3.mp3', N + 'nether4.mp3',
               N + 'rubedo.mp3', N + 'so_below.mp3', N + 'chrysopoeia.mp3'], gap: 120000 },
      // The Aquarium's: the same way, its own three songs.
      { list: [N + 'shuniji.mp3', N + 'axolotl.mp3', N + 'dragon_fish.mp3'], gap: 120000 },
      // The overworld in creative mode: the same way, six songs.
      { list: [N + 'creative1.mp3', N + 'creative2.mp3', N + 'creative3.mp3', N + 'creative4.mp3',
               N + 'creative5.mp3', N + 'creative6.mp3'], gap: 120000 },
      // The overworld in survival: the same way (all twelve).
      { list: [N + 'calm1.mp3', N + 'calm2.mp3', N + 'calm3.mp3', N + 'hal1.mp3', N + 'hal2.mp3',
               N + 'hal3.mp3', N + 'hal4.mp3', N + 'nuance1.mp3', N + 'nuance2.mp3', N + 'piano1.mp3',
               N + 'piano2.mp3', N + 'piano3.mp3'], gap: 120000 }
    ];
    var lastSong = '';
    function pickSong(t) {
      var l = t.list, s;
      do { s = l[Math.floor(Math.random() * l.length)]; } while (l.length > 1 && s === lastSong);
      return (lastSong = s);
    }

    var el = null;
    var current = 0;      // the track el holds
    var wanted = 0;       // what the game last asked for
    var gap = null;       // the silence between plays
    var volume = 1;
    var pending = false;  // asked to play, waiting on a user gesture

    function clamp(v) { return Math.max(0, Math.min(1, v)); }

    var brokenTracks = {};
    function element() {
      if (current !== wanted) {
        if (el) { el.pause(); el = null; }
        current = wanted;
      }
      if (el || !TRACKS[current] || brokenTracks[current]) return el;
      var t = TRACKS[current], id = current;
      el = document.createElement('audio');
      el.loop = !!t.loop;
      el.preload = 'none';
      el.src = pickSong(t);
      // A missing file is the normal case, not a failure worth reporting: give
      // up on it for the session rather than retrying on every screen change.
      var mine = el;
      el.addEventListener('error', function () { if (t.list.length === 1) brokenTracks[id] = true; if (el === mine) el = null; });
      // A song over: silence, then the next one (a fresh element, a new pick).
      el.addEventListener('ended', function () {
        if (el !== mine || gap) return;
        el = null;
        gap = setTimeout(function () { gap = null; if (wanted === id) attempt(); }, t.gap || 0);
      });
      return el;
    }

    // Browsers refuse audio until the page has been interacted with, and the
    // game asks from its frame loop, which is never inside a gesture. So a
    // refusal is expected rather than exceptional: park it and let the next real
    // tap or keypress start the track.
    function attempt() {
      var a = element();
      if (!a) return;
      a.volume = clamp(volume);
      var p = a.play();
      if (p && p['catch']) p['catch'](function () { pending = true; });
    }

    function onGesture() {
      if (!pending) return;
      pending = false;
      if (wanted) attempt();
    }
    ['pointerdown', 'touchend', 'keydown'].forEach(function (name) {
      document.addEventListener(name, onGesture, true);
    });

    window.mcpeMusic = {
      set: function (track, vol) {
        volume = vol;
        if (el) el.volume = clamp(vol);
        if (track === wanted) return;
        wanted = track;
        if (gap) { clearTimeout(gap); gap = null; }
        if (track) {
          attempt();
        } else {
          pending = false;
          if (el) { el.pause(); el = null; }
          current = 0;
        }
      }
    };
  })();
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // Shaders (Options > Graphics > Shaders, off unless turned on; Shader
  // Quality picks Basic or High).
  //
  // 0.6.1 draws through Emscripten's fixed-function emulation and runs no shader
  // of its own, so these sit around it rather than in it: GameRenderer asks
  // begin() before the world is drawn, which points the frame at textures of
  // ours (colour, and depth where WEBGL_depth_texture exists) instead of the
  // screen, and end() after it (before the HUD), which draws to the screen:
  //
  //   light   (needs depth) each pixel's position and facing, rebuilt from the
  //           depth: faces towards the sun warm, away from it cool, a blue
  //           cast at night; on High, screen-space shadows - a short march
  //           from the pixel towards the sun through the depth; and haze by
  //           real distance, taking the sunrise colour towards the sun.
  //   rays    (High, needs depth) light shafts: the bright sky blurred out
  //           from the sun's place on screen, so leaves and blocks cut them.
  //   bloom   the bright parts, a quarter size, blurred, added back.
  //   streak  the brightest parts smeared sideways: the lens line of the sun.
  //   grade   exposure, a soft shoulder, contrast, saturation (greens a
  //           little less), warm highlights and cool shadows, a vignette,
  //           and a tint for the dimension.
  //
  // GameRenderer passes the camera and sun in a block of floats (see end()).
  // The emulation keeps its own idea of the GL state, so end() puts back
  // everything it touched exactly as it found it. Anything failing turns the
  // whole thing off for the session and the game draws as it always has.
  // ---------------------------------------------------------------------------
  (function () {
    var gl = null, broken = false, depthExt = null;
    var W = 0, H = 0;
    var sceneFb, sceneTex, depthTex = null, depthRb = null, litFb, litTex;
    var waterFb = null, waterTex = null, waterDepth = null, waterUsed = false, maskFb = null;
    var SHADOW = 2048, shadowFail = false, shadowFb = null, shadowTex = null, shadowCol = null, shadowUsed = false;
    var qFb = [], qTex = [];
    var quad, P = {};

    var VS = 'attribute vec2 p; varying vec2 uv;' +
      'void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
    var HEAD = 'precision highp float; varying vec2 uv; const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);';
    // The light and rays passes need highp for depth; the rest is fine with
    // mediump, which every phone has (a highp failure only drops those two).
    var HEADM = 'precision mediump float; varying vec2 uv; const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);';

    // Bright parts, plus anything the light pass marked as giving light
    // (alpha 0: torches, lava, fire, glowstone, portals...), however dim.
    var BRIGHT = HEADM + 'uniform sampler2D s; uniform float thr, glowK; uniform vec3 tint;' +
      'void main(){ vec4 t = texture2D(s, uv); vec3 c = t.rgb; float l = dot(c, LUMA);' +
      ' float k = max(smoothstep(thr, 1.0, l), (1.0 - t.a) * glowK);' +
      ' gl_FragColor = vec4(c * tint * k, 1.0); }';
    var BLUR = HEADM + 'uniform sampler2D s; uniform vec2 d;' +
      'void main(){ vec3 c = texture2D(s, uv).rgb * 0.227;' +
      ' c += (texture2D(s, uv + d).rgb + texture2D(s, uv - d).rgb) * 0.195;' +
      ' c += (texture2D(s, uv + d * 2.0).rgb + texture2D(s, uv - d * 2.0).rgb) * 0.122;' +
      ' c += (texture2D(s, uv + d * 3.0).rgb + texture2D(s, uv - d * 3.0).rgb) * 0.054;' +
      ' c += (texture2D(s, uv + d * 4.0).rgb + texture2D(s, uv - d * 4.0).rgb) * 0.016;' +
      ' gl_FragColor = vec4(c, 1.0); }';

    // Depth helpers shared by light and rays.
    var DEPTH = 'uniform sampler2D dep; uniform float near, far, tanY, aspect;' +
      'float lin(float d){ float z = d * 2.0 - 1.0; return 2.0 * near * far / (far + near - z * (far - near)); }' +
      'vec3 viewPos(vec2 q, float d){ float z = lin(d);' +
      ' return vec3((q.x * 2.0 - 1.0) * tanY * aspect * z, (q.y * 2.0 - 1.0) * tanY * z, -z); }' +
      'vec2 toScreen(vec3 v){ return vec2(v.x / (-v.z) / (tanY * aspect), v.y / (-v.z) / tanY) * 0.5 + 0.5; }';

    var LIGHT = HEAD + DEPTH +
      'uniform sampler2D s, wat, wmask, smap; uniform vec2 texel, shTexel;' +
      'uniform vec3 sunV, upV, xV, zV, warm, cool, night, hazeCol, sunsetCol, skyCol, sunCol, camPos;' +
      'uniform vec3 m0, m1, m2, mt;' +
      'uniform float dayK, nightK, sunsetK, hazeK, hazeMax, lightOn, shadows, time, waterOn, ssr;' +
      'uniform float shOn, shR, shD, shCos, shSin, uw, aqua; uniform vec3 shDelta;' +
      'float shadow(vec3 o, float bias){' +
      ' float t = 0.25, occ = 0.0;' +
      ' for (int i = 0; i < 14; i++) {' +
      '  vec3 q = o + sunV * t;' +
      '  if (q.z > -near) break;' +
      '  vec2 su = toScreen(q);' +
      '  if (su.x < 0.0 || su.y < 0.0 || su.x > 1.0 || su.y > 1.0) break;' +
      '  float sd = texture2D(dep, su).r;' +
      '  if (sd > 0.02 && sd < 0.99999) { float dz = -q.z - lin(sd); if (dz > bias && dz < 1.6 + bias) { occ = 1.0; break; } }' +
      '  t = t * 1.32 + 0.08;' +
      ' }' +
      ' return occ;' +
      '}' +
      // Cast shadows (High): the pixel taken into the sun's view (the
      // shadow map GameRenderer drew from the sun, an ortho box shR round
      // the player, shD deep) and tested against what the sun sees there,
      // nine taps for soft edges, fading out at the box's rim.
      'float mapShadow(vec3 p, vec3 n){' +
      ' vec3 e = p + n * (0.05 + length(p) * 0.002) - mt;' +
      ' vec3 w = vec3(dot(e, m0), dot(e, m1), dot(e, m2)) + shDelta;' +
      ' vec3 q = vec3(w.x * shCos - w.y * shSin, -w.z, w.x * shSin + w.y * shCos);' +
      ' vec2 su = q.xy / shR * 0.5 + 0.5; float dz = -q.z / shD * 0.5 + 0.5;' +
      ' if (su.x < 0.0 || su.y < 0.0 || su.x > 1.0 || su.y > 1.0) return 0.0;' +
      ' float occ = 0.0;' +
      ' for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++)' +
      '  occ += step(texture2D(smap, su + vec2(float(x), float(y)) * shTexel * 1.2).r + 0.0015, dz);' +
      ' vec2 rim = abs(su - 0.5) * 2.0;' +
      ' return occ / 9.0 * (1.0 - smoothstep(0.8, 1.0, max(rim.x, rim.y)));' +
      '}' +
      // Water (phase 8). Its surface height field: a few travelling waves,
      // in world blocks; the normal comes from its slope.
      'vec3 waveNormal(vec2 q){' +
      ' float t = time;' +
      ' vec2 g = vec2(0.0);' +
      ' g += vec2(0.8, 0.6) * cos(dot(q, vec2(0.8, 0.6)) * 1.7 + t * 1.6) * 0.06;' +
      ' g += vec2(-0.5, 0.86) * cos(dot(q, vec2(-0.5, 0.86)) * 2.9 + t * 2.3) * 0.04;' +
      ' g += vec2(0.97, -0.24) * cos(dot(q, vec2(0.97, -0.24)) * 5.3 + t * 3.1) * 0.025;' +
      ' g += vec2(-0.2, -0.98) * cos(dot(q, vec2(-0.2, -0.98)) * 9.1 + t * 4.2) * 0.012;' +
      ' return normalize(vec3(-g.x, 1.0, -g.y));' +
      '}' +
      'vec3 skyRefl(vec3 r){' +
      ' float up = dot(r, upV);' +
      ' vec3 c = mix(hazeCol, skyCol, smoothstep(0.0, 0.45, up));' +
      ' float tw = max(dot(r, sunV), 0.0);' +

  <script>
  // ---------------------------------------------------------------------------
  // The wire.
  //
  // 0.6.1 talks to other players over UDP, which a tab has none of. This holds
  // one WebSocket to the relay in tools/lobby and moves RakNet's datagrams over
  // it: send() addresses one at another player's route, recv() hands back the
  // ones that have arrived. WebRakNetInstance.cpp is the only caller, through a
  // SocketLayerOverride -- from RakNet's side nothing has moved.
  //
  // RELAY_URL empty is the off switch and multiplayer is then simply absent,
  // which is what github.io serves: the game still lists players if a lobby is
  // configured, and connect() refuses. ?relay=<url> points a local build at a
  // local one.
  //
  // Nothing here retries a datagram or keeps one in order. That is not an
  // omission -- it is a UDP socket, RakNet is what makes it reliable, and a
  // second attempt at either would fight it.
  // ---------------------------------------------------------------------------
  (function () {
    var RELAY_URL = 'wss://mcausape-lobby.mrfierrocarrilgames.workers.dev/relay';

    var url = new URLSearchParams(location.search).get('relay');
    if (url === null) url = RELAY_URL;
    url = (url || '').replace(/\/+$/, '');

    var sock = null;
    var route = 0;
    var token = '';
    var inbox = [];
    var retryAt = 0;

    // A tab that is not draining its inbox is a tab that has stopped running
    // altogether -- a hidden one still pumps, see below -- and by the time it
    // starts again these are far too old to be worth delivering. Dropping the
    // oldest is what a socket receive buffer does when it overflows, and
    // RakNet already treats loss as ordinary.
    var MAX_INBOX = 256;

    // Long enough not to hammer a service that is down, short enough that a
    // player who blinked out gets back before their peers time them out.
    var RETRY_MS = 3000;

    // ---- Keeping the wire alive when the frame loop is not running ----------
    //
    // The game -- networking included -- is driven by requestAnimationFrame,
    // and a browser stops handing those out to a tab nobody is looking at. So
    // runFrame() stops, and with it the RunUpdateCycleOnce() that is this
    // build's whole update thread: nothing is sent or acked, this inbox fills
    // and is never drained, and the two ends drop each other on the RakNet
    // timeout. Switching tabs ended the game.
    //
    // mcpe_pump_net() is the network half of a frame with no drawing in it,
    // and what decides to call it is whether frames are actually arriving --
    // not document.hidden. Those are not the same question: an occluded or
    // unfocused window is throttled to a few frames a second while still
    // reporting itself visible, and a tab really in the background gets none
    // at all while reporting the same thing on some platforms. Asking the
    // frame loop directly covers every one of those without naming any of
    // them, and stops on its own the moment frames come back.
    //
    // Two things drive the check, because neither is enough alone:
    //
    //  - every datagram that arrives, since a WebSocket message is delivered
    //    to a backgrounded tab whatever its timers are doing. This is what
    //    keeps a hidden player answering a peer who is still playing.
    //  - a 1s interval, so we originate traffic rather than only replying.
    //    Background timers are clamped to about one a second, and Chrome cuts
    //    that to one a minute after five minutes hidden -- survivable only
    //    because each side's send wakes the other's onmessage.
    //
    // MIN_PUMP_MS is not throttling for its own sake: RunUpdateCycleOnce()
    // works out what to send from how long it has been since the last one, so
    // a burst of arrivals pumped back to back is one frame counted many times
    // and the sends never go. Anything skipped stays in the inbox, and the
    // next pump drains all of it -- the receive path is a loop, not one-shot.
    var STALL_MS = 250;
    var MIN_PUMP_MS = 20;
    var lastPumpAt = 0;

    // Rides along with the module's own frame callback -- same vsync, same
    // throttling -- and does nothing but say when it last ran.

      var now = Date.now();
      if (now - lastFrameAt < STALL_MS) return;   // frames are doing this for us
      if (now - lastPumpAt < MIN_PUMP_MS) return;

        // token that lets it prove so to /announce.

              // route 0, which is "listed but not joinable". Say so again now
              // rather than leaving it that way until the next heartbeat.
              if (window.mcpeLobby) window.mcpeLobby.routeChanged();

      // lobby publishing an address that no longer reaches this tab.

    window.mcpeNet = {
      // Whether this deployment has multiplayer at all -- not whether the socket
      // happens to be up this instant. The game asks before starting a peer, and
      // a peer that starts a round trip before its socket does is fine: the
      // datagrams it sends meanwhile are lost, which is a thing RakNet's
      // connection attempts already retry through.
      enabled: function () { return !!url; },

      ready: function () { return !!sock && sock.readyState === 1 && route !== 0; },
      route: function () { return route; },
      token: function () { return token; },

      open: function () { connect(); },

      close: function () {
        if (sock) { try { sock.close(); } catch (e) { /* already gone */ } }
        sock = null;
        route = 0;
        token = '';
        inbox.length = 0;
        // A deliberate close is not a failure to back off from: the next world
        // should be able to open one immediately.
        retryAt = 0;
      },

      send: function (dest, bytes) {
        if (!sock || sock.readyState !== 1) return;
        var out = new Uint8Array(4 + bytes.length);
        out[0] = (dest >>> 24) & 255;
        out[1] = (dest >>> 16) & 255;
        out[2] = (dest >>> 8) & 255;
        out[3] = dest & 255;
        out.set(bytes, 4);
        try { sock.send(out); } catch (e) { /* closing under us; onclose tidies */ }
      },

      // {route, bytes} for the oldest datagram waiting, or null. The four-byte
      // header the relay wrote is peeled off here so the caller only ever sees
      // what the other player's RakNet actually sent.
      recv: function () {
        while (inbox.length) {
          var m = inbox.shift();
          if (m.length < 4) continue;
          return {
            route: ((m[0] << 24) | (m[1] << 16) | (m[2] << 8) | m[3]) >>> 0,
            bytes: m.subarray(4)
          };
        }
        return null;
      }
    };

    // The socket drops on its own if the game is between worlds, so something
    // has to bring it back. Cheap: it returns immediately unless there is no
    // socket and the backoff has expired.
    setInterval(connect, 1000);

    // The half of the background pump that does not wait to be spoken to. Also
    // returns immediately while frames are flowing, where runFrame has it.
    setInterval(pumpIfFrameLoopStalled, 1000);

    // The chat on a touch screen (ChatScreen): 0 typing, 1 sent, 2 dropped.
    (function () {
      var input = document.getElementById('chatBridge');
      var state = 2;
      if (!input) return;
      input.addEventListener('keydown', function (e) {
        // Kept from the game's key handlers (on the window, bubbling), which
        // would otherwise cancel the letters before they reached the input.
        e.stopPropagation();
        if (e.key === 'Enter') { state = 1; e.preventDefault(); input.blur(); }
      });
      input.addEventListener('keyup', function (e) { e.stopPropagation(); });
      input.addEventListener('keypress', function (e) { e.stopPropagation(); });
      input.addEventListener('blur', function () { if (state === 0) state = 2; });
      window.mcpeChatBridge = {
        open: function () { input.value = ''; state = 0; input.focus(); },
        value: function () { return input.value; },
        state: function () { return state; },
        close: function () { state = 2; input.blur(); }
      };
    })();

    // A newer deploy: version.txt (written by the deploy) holds its number.
    // Every two minutes, compare it with this build's; once it is ahead, the
    // game says so in the chat (Minecraft::deployNotice), once.
    (function () {
      var told = false;
      function checkDeploy() {
        if (told || !window.mcpeReady || !window.Module || !Module._mcpe_deploy_number) return;
        fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (text) {
            var latest = parseInt(text, 10), mine = Module._mcpe_deploy_number();
            if (latest > 0 && mine > 0 && latest > mine && !told) {
              told = true;
              Module._mcpe_deploy_notice();
            }
          })
          .catch(function () {});
      }
      setInterval(checkDeploy, 120000);
    })();

    // Last word on the way out. The peer timeout is long enough to ride out a
    // throttled background tab (see WebRakNetInstance), which would otherwise
    // mean a closed tab standing in everyone's world for two minutes. This is
    // the same flush leaveGame does, spent on the way to the door: best-effort,
    // like every other unload handler, but it usually lands.
    window.addEventListener('pagehide', function () {
      if (window.mcpeReady && window.Module && Module._mcpe_net_leave)
        Module._mcpe_net_leave();
    });
  })();
  </script>

  <script>
  // ---------------------------------------------------------------------------
  // Join Game presence.
  //
  // 0.6.1 finds games with a UDP broadcast to 255.255.255.255, which a tab
  // cannot send, so the Join card was always empty here. This announces "I am
  // playing" while a world is open and asks who else is, against the small
  // service in tools/lobby. WebRakNetInstance.cpp reads it back out.
  //
  // The endpoint lives in the page rather than the wasm for the same reason
  // window.mcpeTouch does: it is a property of where this is deployed, not of
  // the build, and it can be changed without a three-minute CI round trip.
  //
  // LOBBY_URL empty is the off switch, and off is a supported state -- every
  // path below degrades to an empty list, which is exactly what an empty LAN
  // looked like before any of this existed. Killing the service does the same
  // thing without touching the page. ?lobby=<url> points a build at a local one.
  // ---------------------------------------------------------------------------
  (function () {
    var LOBBY_URL = 'https://mcausape-lobby.mrfierrocarrilgames.workers.dev';

    var url = new URLSearchParams(location.search).get('lobby');
    if (url === null) url = LOBBY_URL;
    url = (url || '').replace(/\/+$/, '');

    // Stable for the life of the tab, and per tab rather than per browser: two
    // windows are two players. sessionStorage so a reload keeps its place in
    // the list instead of leaving a ghost behind for a TTL.
    var id = sessionStorage.getItem('mcpeLobbyId');
    if (!id) {
      id = Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem('mcpeLobbyId', id);
    }

    var HEARTBEAT_MS = 10000;
    var POLL_MS = 3000;

    var name = '', world = '';
    // What the game reports about the world it is hosting; see setInfo.
    var info = { whitelist: 0, players: 1 };
    // The host's /motd, and this build's deploy number (only the same deploy
    // can join: the game refuses any other at login).
    var motd = '';
    function deployNumber() {
      return (window.Module && Module._mcpe_deploy_number) ? Module._mcpe_deploy_number() : 0;
    }
    var limitToldAt = 0;
    var beat = null, poll = null;
    var others = [];

    function post(body) {
      if (!url) return;
      // keepalive so the "gone" on the way out still goes when the tab is
      // closing and the page is being torn down around it.
      fetch(url + '/announce', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        keepalive: true
      }).then(function (r) {
        // The lobby holds ten worlds; an eleventh is refused and not listed. It
        // still runs, so say why nobody can find it -- not on every heartbeat.
        if (r.status === 429 && Date.now() - limitToldAt > 120000) {
          limitToldAt = Date.now();
          if (window.mcpeToast) window.mcpeToast('There are already 10 online worlds: yours is not listed');
        }
      }).catch(function () {});
    }

    // The route is what other players dial, and the token is what stops anyone
    // else claiming it. Both come from the relay socket and are absent while it
    // is down or not configured, which publishes a route of 0 -- listed, not
    // joinable. The next heartbeat carries the real one once the socket is up.
    function beatOnce() {
      var net = window.mcpeNet;
      post({
        id: id,
        name: name,
        // The motd and deploy ride inside the world's name as well, after a
        // \u001f each: the lobby Worker keeps only the fields it knows, and
        // one deployed before they existed drops them. records() splits them
        // back out.
        world: world + '\u001f' + motd + '\u001f' + deployNumber(),
        route: net ? net.route() : 0,
        token: net ? net.token() : '',
        whitelist: info.whitelist,
        players: info.players,
        motd: motd,
        deploy: deployNumber()
      });
    }

    function refresh() {
      if (!url) { others = []; return; }
      fetch(url + '/list', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : { players: [] }; })
        .then(function (data) {
          others = (data.players || []).filter(function (p) { return p.id !== id; });
        })
        // A lobby that is down is a lobby with nobody in it. Clearing rather
        // than keeping the last answer is what makes stopping the service look
        // like an ordinary quiet night instead of a frozen list.
        .catch(function () { others = []; });
    }

    var hostWatch = null, hostWatchRoute = 0, hostWatchId = null, hostWatchState = 0;

    window.addEventListener('pagehide', function () {
      if (beat) post({ id: id, gone: true });
    });

    window.mcpeLobby = {
      announce: function (playerName, worldName) {
        name = playerName || 'Player';
        if (worldName) world = worldName;
        if (beat) clearInterval(beat);
        beatOnce();
        beat = setInterval(beatOnce, HEARTBEAT_MS);
      },

      setMotd: function (text) {
        motd = (text || '').replace(/[\t\n\r]/g, ' ').slice(0, 64);
        if (beat) beatOnce();
      },

      // From the game: whether the world has a whitelist, how many are in it.
      setInfo: function (whitelist, players) {
        info = { whitelist: whitelist ? 1 : 0, players: players || 1 };
        if (beat) beatOnce();
      },

      setWorld: function (worldName) {
        world = worldName || '';
        if (beat) beatOnce();
      },

      // The relay calls this when a route turns up or changes. Only meaningful
      // while a world is running, which is exactly when `beat` is set.
      routeChanged: function () {
        if (beat) beatOnce();
      },

      leave: function () {
        if (beat) { clearInterval(beat); beat = null; }
        post({ id: id, gone: true });
        // The world name is deliberately kept. Minecraft::hostMultiplayer
        // disconnects before it hosts, and setLevel -- the only thing that knows
        // the name -- has already run by then, so clearing it here published
        // every world as nameless. Nothing is announced once the heartbeat has
        // stopped, and the next world's setLevel overwrites it.
      },

      startListing: function () {
        if (poll) return;
        refresh();
        poll = setInterval(refresh, POLL_MS);
      },

      stopListing: function () {
        if (poll) { clearInterval(poll); poll = null; }
        others = [];
      },

      // A visitor watching the host it joined. The host's relay socket
      // closing (tab closed, crashed, network gone) turns its lobby entry's
      // route to 0 at once, which RakNet would only notice after its two
      // minute timeout. 0 = fine or unknown, 1 = its socket is gone,
      // 2 = no longer listed (left, or the lobby forgot it: the game asks for
      // silence from the host too before believing that one).
      watchHost: function (route) {
        if (hostWatch) { clearInterval(hostWatch); hostWatch = null; }
        hostWatchRoute = route >>> 0;
        hostWatchId = null;
        hostWatchState = 0;
        if (!url || !hostWatchRoute) return;
        hostWatch = setInterval(function () {
          fetch(url + '/list', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (!data || !data.players) return;
              var players = data.players, entry = null, i;
              for (i = 0; i < players.length; i++) {
                if (hostWatchId ? players[i].id === hostWatchId
                                : ((players[i].route || 0) >>> 0) === hostWatchRoute) { entry = players[i]; break; }
              }
              if (!hostWatchId) {
                // Not seen yet: nothing to compare against.
                if (entry) hostWatchId = entry.id;
                return;
              }
              if (!entry) hostWatchState = 2;
              else hostWatchState = (((entry.route || 0) >>> 0) === hostWatchRoute) ? 0 : 1;
            })
            .catch(function () { /* a lobby that is down says nothing either way */ });
        }, POLL_MS);
      },

      hostState: function () { return hostWatchState; },

      // Flat records rather than JSON: the reader is C++03 with no parser in it.
      records: function () {
        return others.map(function (p) {
          var parts = String(p.world || '').split('\u001f');
          var w = parts[0], m = parts.length > 1 ? parts[1] : (p.motd || ''), d = parts.length > 2 ? (parseInt(parts[2], 10) || 0) : (p.deploy || 0);
          return (p.name || '') + '\t' + w.replace(/[\t\n\r]/g, ' ') + '\t' + ((p.route || 0) >>> 0) +
            '\t' + (p.whitelist ? 1 : 0) + '\t' + (p.players || 1) +
            '\t' + String(m).replace(/[\t\n\r]/g, ' ') + '\t' + d;
        }).join('\n');
      }
    };
  })();
  </script>

  {{{ SCRIPT }}}
</body>
